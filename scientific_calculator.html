<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 Python Scientific Calculator</title>

  <style>
    /* ======== GLOBAL STYLES ======== */
    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #0a0f1a, #000);
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
      overflow: hidden;
    }

    /* ======== BACKGROUND ANIMATION ======== */
    @keyframes float {
      0% { transform: translateY(0px); opacity: 0.8; }
      50% { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.8; }
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: float 6s infinite ease-in-out;
    }

    .circle1 {
      width: 300px;
      height: 300px;
      background: #4b6cb7;
      top: 10%;
      left: 15%;
      animation-delay: 0s;
    }

    .circle2 {
      width: 400px;
      height: 400px;
      background: #ff00ff;
      bottom: 10%;
      right: 10%;
      animation-delay: 2s;
    }

    /* ======== CALCULATOR CONTAINER ======== */
    .calculator {
      position: relative;
      background: rgba(20, 20, 40, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      padding: 25px;
      width: 340px;
      text-align: center;
      backdrop-filter: blur(20px);
      transition: 0.3s ease;
      z-index: 10;
    }

    .calculator:hover {
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
      transform: scale(1.03);
    }

    .calculator h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowTitle 3s infinite alternate;
    }

    @keyframes glowTitle {
      from { text-shadow: 0 0 10px #00ffff; }
      to { text-shadow: 0 0 20px #ff00ff; }
    }

    /* ======== DISPLAY ======== */
    #display {
      width: 100%;
      padding: 15px;
      font-size: 1.4rem;
      text-align: right;
      border: none;
      border-radius: 10px;
      outline: none;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #00ffff;
      box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    #display:focus {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    /* ======== BUTTON GRID ======== */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 255, 0.15));
      color: #fff;
      cursor: pointer;
      transition: 0.2s ease-in-out;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      background: linear-gradient(145deg, rgba(0, 255, 255, 0.4), rgba(255, 0, 255, 0.4));
    }

    button.clear {
      background: linear-gradient(145deg, #ff3c3c, #c40000);
      box-shadow: 0 0 15px rgba(255, 60, 60, 0.4);
    }

    button.del {
      background: linear-gradient(145deg, #ff8c00, #cc6600);
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
    }

    button.clear:hover {
      box-shadow: 0 0 25px #ff3c3c;
    }

    button.del:hover {
      box-shadow: 0 0 25px #ff8c00;
    }

    /* ======== FOOTER ======== */
    footer {
      margin-top: 25px;
      font-size: 0.9rem;
      opacity: 0.8;
      text-align: center;
      z-index: 5;
    }

    footer p {
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ======== ANIMATED ENTRY ======== */
    .calculator {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- Glowing animated background elements -->
  <div class="glow-circle circle1"></div>
  <div class="glow-circle circle2"></div>

  <div class="calculator">
    <h1>🐍 Python Scientific Calculator</h1>
    <input type="text" id="display" placeholder="0" readonly />

    <div class="button-grid">
      <button onclick="clearDisplay()" class="clear">C</button>
      <button onclick="deleteLast()" class="del">⌫</button>
      <button onclick="append('(')">(</button>
      <button onclick="append(')')">)</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('/')">÷</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('*')">×</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('-')">−</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="append('+')">+</button>

      <button onclick="func('sin')">sin</button>
      <button onclick="func('cos')">cos</button>
      <button onclick="func('tan')">tan</button>
      <button onclick="func('ln')">ln</button>

      <button onclick="func('log10')">log</button>
      <button onclick="func('fact')">n!</button>
      <button onclick="append('**')">xʸ</button>
      <button onclick="append('%')">%</button>
    </div>
  </div>

  <footer>
    <p>Made with by Om Singh, Abhay Jham, Priyansh Indane, Devansh Mishra, Ronit Chudri</p>
  </footer>

  <script>
    function append(value) {
      document.getElementById("display").value += value;
    }

    function clearDisplay() {
      document.getElementById("display").value = "";
    }

    function deleteLast() {
      const display = document.getElementById("display");
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      const display = document.getElementById("display");
      try {
        display.value = eval(display.value
          .replace("÷", "/")
          .replace("×", "*"));
      } catch {
        display.value = "Error";
      }
    }

    function func(operation) {
      const display = document.getElementById("display");
      let value = parseFloat(display.value);

      if (isNaN(value)) {
        display.value = "Error";
        return;
      }

      switch (operation) {
        case "sin":
          display.value = Math.sin((value * Math.PI) / 180).toFixed(6);
          break;
        case "cos":
          display.value = Math.cos((value * Math.PI) / 180).toFixed(6);
          break;
        case "tan":
          display.value = Math.tan((value * Math.PI) / 180).toFixed(6);
          break;
        case "ln":
          display.value = Math.log(value).toFixed(6);
          break;
        case "log10":
          display.value = Math.log10(value).toFixed(6);
          break;
        case "fact":
          display.value = factorial(value);
          break;
      }
    }

    function factorial(n) {
      if (n < 0) return "Error";
      if (n === 0 || n === 1) return 1;
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }
  </script>
</body>
</html>
